name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml and the current releases. One
        # Windows run because that is where most ComfyUI installs are, and the
        # tests do read files from disk.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        # The package itself needs nothing; these are the gates around it.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Ruff
        # Also the syntax gate for every Python file in the tree, tests
        # included: a file ruff cannot parse is an error here.
        run: ruff check .

      - name: Unit tests
        # Includes the package-import smoke test, so a node that would fail to
        # load in ComfyUI fails here too, and the example workflows are run
        # rather than only parsed.
        run: coverage run --branch -m unittest discover -s tests -p "test_*.py" -v

      - name: Coverage gate
        # The shipped code only. The tests, and the harness they load it with,
        # would otherwise inflate the number they exist to measure.
        run: coverage report --fail-under=94 --include="imageir/*,image_ir_nodes.py,__init__.py"

  import-without-comfyui:
    name: Engine imports with no dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Import the engine on a bare interpreter
        # requirements.txt is empty on purpose. This is the job that keeps it
        # true: nothing is installed here, not even the test tooling.
        run: |
          python -c "
          from imageir import audit, compose, parse_dsl
          ir = parse_dsl('subject.identity = a woman\nsubject.gaze = toward camera')
          prompt = compose(ir, motions=['blink']).h3
          print(prompt)
          assert audit(ir, prompt).clean
          assert not audit(ir, 'she turns from looking away toward the camera').clean
          "
