name: CI

# Every push, on every branch: a branch whose state is invisible until someone
# opens a pull request is a branch nobody can trust. Pull requests stay here for
# the case a push cannot cover — one opened from a fork, whose commits never
# land in this repository.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # Skip the pull-request run when the branch lives in this repository: its
    # push already ran this workflow on the same commit, and two identical runs
    # in the checks list only make a red one harder to find.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository

    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml and the current releases. One
        # Windows run because that is where most ComfyUI installs are, and the
        # tests do read files from disk.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        # The package itself needs nothing; these are the gates around it.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Ruff
        # Also the syntax gate for every Python file in the tree, tests
        # included: a file ruff cannot parse is an error here.
        run: ruff check .

      - name: Unit tests
        # Includes the package-import smoke test, so a node that would fail to
        # load in ComfyUI fails here too, and the example workflows are run
        # rather than only parsed.
        run: coverage run --branch -m unittest discover -s tests -p "test_*.py" -v

      - name: Coverage gate
        # The shipped code only. The tests, and the harness they load it with,
        # would otherwise inflate the number they exist to measure.
        run: >-
          coverage report --fail-under=88
          --include="imageir/*,imageir/backend/*,image_ir_nodes.py,image_ir_backend_nodes.py,image_ir_intent_nodes.py,image_ir_llama_manager_nodes.py,image_ir_web.py,__init__.py"

  import-without-comfyui:
    name: Engine imports with no dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip the pull-request run when the branch lives in this repository: its
    # push already ran this workflow on the same commit, and two identical runs
    # in the checks list only make a red one harder to find.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Import the engine on a bare interpreter
        # requirements.txt is empty on purpose. This is the job that keeps it
        # true: nothing is installed here, not even the test tooling — no
        # numpy, no Pillow, no HTTP library. Every backend and the image
        # encoder must still import and work.
        run: |
          python -c "
          from imageir import audit, compose, parse_dsl
          from imageir.h3 import compose_h3
          from imageir.intent import UserIntent, IntentClause
          from imageir.h3_modes import compose_mode
          from imageir.references import Reference, ReferencePack
          from imageir.provenance import guard_document
          from imageir.backend import BackendConfig, get_backend
          from imageir.backend.llama_router import LlamaRouterClient, RouterModel
          from imageir.imaging import image_to_payload

          ir = parse_dsl('subject.identity = a woman\nsubject.gaze = toward camera')
          prompt = compose(ir, motions=['blink']).final
          print(prompt)
          assert audit(ir, prompt).clean
          assert not audit(ir, 'she turns from looking away toward the camera').clean

          h3 = compose_h3(ir, motions=['blink']).render()
          assert h3.startswith('For the target video, at 0.00 seconds')
          assert 'integrated_multimodal_description:' in h3

          intent = UserIntent('Wave.', (('request', 'Wave.'),), requested_actions=(IntentClause('Wave.', 'request', 'Wave.'),))
          pack = ReferencePack((Reference('Picture 1', 'image', 'identity', '1', ir),))
          for inputs in ({}, {'first': ir}, {'first': ir, 'last': ir}, {'last': ir}, {'references': pack}):
              assert guard_document(compose_mode(intent, **inputs)).clean

          for provider in ('llama_cpp', 'openai_compatible', 'gemini'):
              get_backend(BackendConfig(provider=provider, model_name='m', base_url='http://x:1'))

          assert RouterModel('m', 'unloaded', True).vision
          LlamaRouterClient('http://127.0.0.1:8080', transport=lambda *args: {'data': []}).list_models()

          payload = image_to_payload([[[[0.5, 0.5, 0.5]]]])
          assert payload.data[:8] == b'\x89PNG\r\n\x1a\n'
          print('every backend and the standard-library image encoder import clean')
          "
